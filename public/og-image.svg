<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0F0F14"/>
  <rect width="1200" height="630" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F0F14"/>
      <stop offset="0.5" stop-color="#17172A"/>
      <stop offset="1" stop-color="#0F0F14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4F6EF7"/>
      <stop offset="1" stop-color="#9C6BE8"/>
    </linearGradient>
  </defs>

  <!-- Grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="105" x2="1200" y2="105" stroke="white" stroke-width="1"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke="white" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="white" stroke-width="1"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="white" stroke-width="1"/>
    <line x1="0" y1="525" x2="1200" y2="525" stroke="white" stroke-width="1"/>
    <line x1="150" y1="0" x2="150" y2="630" stroke="white" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="white" stroke-width="1"/>
    <line x1="450" y1="0" x2="450" y2="630" stroke="white" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-width="1"/>
    <line x1="750" y1="0" x2="750" y2="630" stroke="white" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="white" stroke-width="1"/>
    <line x1="1050" y1="0" x2="1050" y2="630" stroke="white" stroke-width="1"/>
  </g>

  <!-- Logo pill -->
  <rect x="80" y="80" width="180" height="46" rx="23" fill="url(#accent)" opacity="0.15"/>
  <rect x="80" y="80" width="180" height="46" rx="23" stroke="url(#accent)" stroke-width="1" fill="none"/>
  <text x="170" y="109" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="white">MindState</text>

  <!-- Main headline -->
  <text x="80" y="240" font-family="Georgia, serif" font-size="80" font-weight="700" fill="white">Sharper</text>
  <text x="80" y="330" font-family="Georgia, serif" font-size="80" font-weight="700" font-style="italic">
    <tspan fill="url(#accent)">Every Day.</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="390" font-family="system-ui, sans-serif" font-size="24" fill="#94A3B8">
    20 logic games · 20,000 stages · 5 free plays daily
  </text>

  <!-- Stat pills -->
  <rect x="80" y="440" width="160" height="48" rx="24" fill="rgba(79,110,247,0.15)" stroke="rgba(79,110,247,0.4)" stroke-width="1"/>
  <text x="160" y="469" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4F6EF7">20 Games</text>

  <rect x="256" y="440" width="180" height="48" rx="24" fill="rgba(156,107,232,0.15)" stroke="rgba(156,107,232,0.4)" stroke-width="1"/>
  <text x="346" y="469" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#9C6BE8">20,000 Stages</text>

  <rect x="452" y="440" width="160" height="48" rx="24" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
  <text x="532" y="469" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#22C55E">Zero Ads</text>

  <!-- Right side — mini game board preview -->
  <g transform="translate(750, 150)">
    <!-- Tango board preview -->
    <rect x="0" y="0" width="360" height="360" rx="24" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <!-- 4x4 grid cells -->
    <g>
      <!-- Row 0 -->
      <rect x="20" y="20" width="72" height="72" rx="12" fill="rgba(255,255,255,0.08)"/>
      <text x="56" y="64" text-anchor="middle" font-size="32">☀️</text>
      <rect x="104" y="20" width="72" height="72" rx="12" fill="rgba(255,255,255,0.05)"/>
      <rect x="188" y="20" width="72" height="72" rx="12" fill="rgba(255,255,255,0.08)"/>
      <text x="224" y="64" text-anchor="middle" font-size="32">🌙</text>
      <rect x="272" y="20" width="72" height="72" rx="12" fill="rgba(255,255,255,0.05)"/>
      <!-- Row 1 -->
      <rect x="20" y="104" width="72" height="72" rx="12" fill="rgba(255,255,255,0.05)"/>
      <rect x="104" y="104" width="72" height="72" rx="12" fill="rgba(255,255,255,0.08)"/>
      <text x="140" y="148" text-anchor="middle" font-size="32">🌙</text>
      <rect x="188" y="104" width="72" height="72" rx="12" fill="rgba(255,255,255,0.05)"/>
      <rect x="272" y="104" width="72" height="72" rx="12" fill="rgba(255,255,255,0.08)"/>
      <text x="308" y="148" text-anchor="middle" font-size="32">☀️</text>
      <!-- Row 2 -->
      <rect x="20" y="188" width="72" height="72" rx="12" fill="rgba(255,255,255,0.08)"/>
      <text x="56" y="232" text-anchor="middle" font-size="32">🌙</text>
      <rect x="104" y="188" width="72" height="72" rx="12" fill="rgba(255,255,255,0.05)"/>
      <rect x="188" y="188" width="72" height="72" rx="12" fill="rgba(255,255,255,0.08)"/>
      <text x="224" y="232" text-anchor="middle" font-size="32">☀️</text>
      <rect x="272" y="188" width="72" height="72" rx="12" fill="rgba(255,255,255,0.05)"/>
      <!-- Row 3 -->
      <rect x="20" y="272" width="72" height="72" rx="12" fill="rgba(255,255,255,0.05)"/>
      <rect x="104" y="272" width="72" height="72" rx="12" fill="rgba(255,255,255,0.08)"/>
      <text x="140" y="316" text-anchor="middle" font-size="32">☀️</text>
      <rect x="188" y="272" width="72" height="72" rx="12" fill="rgba(255,255,255,0.05)"/>
      <rect x="272" y="272" width="72" height="72" rx="12" fill="rgba(255,255,255,0.08)"/>
      <text x="308" y="316" text-anchor="middle" font-size="32">🌙</text>
    </g>
    <!-- Tango label -->
    <rect x="100" y="336" width="160" height="32" rx="16" fill="url(#accent)" opacity="0.2"/>
    <text x="180" y="357" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="white">Tango · Hard · 1000 stages</text>
  </g>

  <!-- URL -->
  <text x="80" y="580" font-family="system-ui, sans-serif" font-size="16" fill="rgba(255,255,255,0.3)">mindstate.vercel.app</text>
</svg>
